[project]
name = "fpl-squad-selector"
version = "0.1.0"
description = "Scripts for picking an optimal Fantasy Premier League squad using dynamic programming."
authors = [
    { name = "Eiríkur Fannar Torfason", email = "eirikur.torfason@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.2",
    "tqdm>=4.66.5",
    "numpy>=2.1.1",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "black>=24.8.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
